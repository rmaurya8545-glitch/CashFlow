
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name ="description" content="A Simple CashFlow Tracker app to manage salary and expenses.">
    <title>CashFlow Pro -Salary & Expense Tracker</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body>

    <main class = "container">
        <header>
            <h1>💸 CashFlow Pro</h1>
        

        <section class = "summary">
            <div class="card">
                <h3>Total Salary</h3>
                <p>₹<span id = "salaryDisplay">0</span></p>
            </div>

            <div class = "card">
                <h3>Total Expenses</h3>
                <p>₹<span id = "expenseDisplay">0</span></p>
            </div>

            <div class = "card">
                <h3> Remaining Balance</h3>
                <p>₹<span id = "balanceDisplay">0</span></p>
            </div>

        <section>

          <!--Salary-->

        <section class = "form-section">

            <label for="salaryInput">Enter Salary</label>
            <input type="number" id="salaryInput" placeholder="Enter your Salary" min="0" max="1000000000" step="0.01">
            <button id="salaryBtn">Set Salary</button>
            
            <p id = "salaryMessage"></p>

        </section>


                <!--Chart section-->

                <section class = "chart-section">
                    <h3>Expense Breakdown</h3>
                    <canvas id = "expenseChart"></canvas>
                </section>

                <!--Expense-->

                <section class = "form-section">

                <label for="expenseName">Expense Name</label>

                <select id = "expenseName">
                    <option value = "Food">Food</option>
                    <option value = "Rent">Rent</option>
                    <option value = "Transport">Transport</option>
                    <option value = "Shopping">Shopping</option>
                    <option value = "Medical">Medical</option>
                    <option value = "Electricity bill">Electricity Bill</option>
                    <option value = "Internet Recharge">Internet Recharge</option>
                    <option value = "Education">Education</option>
                    <option value = "Entertainment">Entertainment</option>
                    <option value = "Fuel">Fuel</option>
                    <option value = "Others">Others</option>
                </select>



                <label for="expenseAmount">Amount ₹</label>
                <input type="number" id="expenseAmount" placeholder="Enter Amount">

                <label for="dateInput">Date</label>
                <input type = "date" id="dateInput">

                <button id = "expenseBtn"> +Add Expense</button>

                <p id = "expenseMessage"></p>
                </section>

                <!--Transaction-->
                <section class = "transaction">
                <h2>📝Transaction</h2>
                <ul id = "expenseList">
                    <li id = "emptyMessage">
                        No Expense Added yet.
                    </li>
                </ul>
                </section>
            </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>       
    <script src="Script/script.js"></script>

    
    
</body>
</html>
